# profile for local development

spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: dev
  security:
    user:
      # noinspection SpellCheckingInspection
      name: devuser
      # noinspection SpellCheckingInspection
      password: devuser123

  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: alina.golyachenko16@gmail.com
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  liquibase:
    enabled: true
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: monkey_finance_app_dev
        format_sql: true
    liquibase:
      default-schema: monkey_finance_app_dev

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE