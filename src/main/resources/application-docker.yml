spring:
  cloud:
    vault:
      enabled: false

  datasource:
    url: jdbc:postgresql://db:5432/monkey_finance_dev?currentSchema=dev
    username: monkey_finance_admin
    password: password
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  liquibase:
    enabled: true
    clear-checksums: false
    contexts: docker
    default-schema: dev
    change-log: classpath:db/changelog/db.changelog-master.yml

management:
  otlp:
    metrics:
      export:
        enabled: false