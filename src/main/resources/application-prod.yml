spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_POST:5432}/monkey_finance_prod
    username: monkey_finance_app
    password: ${DB_APP_PASSWORD}

  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate