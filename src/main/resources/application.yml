spring:
  application:
    name: monkey_finance
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:test_user}
    password: ${SPRING_MAIL_PASSWORD:test_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: dev
currency:
  api:
    url: ${CURRENCY_API_URL}
    key: ${CURRENCY_API_KEY}
server:
  port: 8080