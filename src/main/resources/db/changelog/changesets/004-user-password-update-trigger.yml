databaseChangeLog:
  - changeSet:
      id: 004-user_password_update_trigger
      author: alina
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION dev.update_password_timestamp()
              RETURNS TRIGGER AS $$
              BEGIN
                IF NEW.password IS DISTINCT FROM OLD.password THEN
                   NEW.password_updated_at = CURRENT_TIMESTAMP;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;;
              
              DROP TRIGGER  IF EXISTS trigger_update_password_timestamp ON dev.users;;
              
              CREATE TRIGGER trigger_update_password_timestamp
              BEFORE UPDATE ON dev.users
              FOR EACH ROW
              EXECUTE FUNCTION dev.update_password_timestamp();;
