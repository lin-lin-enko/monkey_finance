  databaseChangeLog:
    - changeSet:
        id: 009-create-ledger-activity-logs-table
        author: alina
        changes:
          - createTable:
              schemaName: dev
              tableName: ledger_activity_logs
              columns:
                - column:
                    name: id
                    type: uuid
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: ledger_id
                    type: uuid
                    constraints:
                      foreignKeyName: fk_ledger_activity_logs_ledger
                      referencedSchemaName: dev
                      referencedTableName: ledgers
                      referencedColumnNames: id
                      nullable: false
                - column:
                    name: actor_id
                    type: uuid
                    constraints:
                      foreignKeyName: fk_ledger_activity_logs_actor
                      referencedSchemaName: dev
                      referencedTableName: users
                      referencedColumnNames: id
                      nullable: false
                - column:
                    name: target_id
                    type: uuid
                - column:
                    name: action_type
                    type: varchar(50)
                    constraints:
                      nullable: false
                - column:
                    name: description
                    type: varchar(255)
                - column:
                    name: created_at
                    type: timestamptz
                    defaultValueComputed: NOW()
                    constraints:
                      nullable: false