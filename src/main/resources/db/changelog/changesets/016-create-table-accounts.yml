  databaseChangeLog:
    - changeSet:
        id: 016-create-table-accounts
        author: alina
        changes:
          - createTable:
              schemaName: dev
              tableName: accounts
              columns:
                - column:
                    name: id
                    type: uuid
                    defaultValueComputed: gen_random_uuid()
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: name
                    type: varchar(50)
                    constraints:
                      nullable: false
                - column:
                    name: type
                    type: varchar(20)
                    constraints:
                      nullable: false
                - column:
                    name: institution
                    type: varchar(70)
                - column:
                    name: balance
                    type: decimal(13,2)
                    defaultValueNumeric: 0
                    constraints:
                      nullable: false
                - column:
                    name: currency
                    type: varchar(3)
                    constraints:
                      nullable: false
                - column:
                    name: description
                    type: varchar(255)
                - column:
                    name: ledger_id
                    type: uuid
                    constraints:
                      nullable: false
                      foreignKeyName: fk_accounts_ledger
                      referencedSchemaName: dev
                      referencedTableName: ledgers
                      referencedColumnNames: id
                      onDelete: CASCADE

          - createIndex:
              indexName: idx_accounts_ledger_id
              tableName: accounts
              columns:
                - column:
                    name: ledger_id