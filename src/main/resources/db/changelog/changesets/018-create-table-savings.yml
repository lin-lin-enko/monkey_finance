databaseChangeLog:
  - changeSet:
      id: 018-create-table-savings
      author: alina
      changes:
        - createTable:
            schemaName: dev
            tableName: savings
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    referencedSchemaName: dev
                    referencedTableName: accounts
                    referencedColumnNames: id
                    foreignKeyName: fk_savings_account
                    nullable: false
                    onDelete: CASCADE
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(13, 2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: target_sum
                  type: decimal(13, 2)
              - column:
                  name: due_date
                  type: timestamptz
              - column:
                  name: percentage_rate
                  type: decimal(3, 2)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValue: now()
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: dev
            indexName: idx_savings_account_id
            tableName: savings
            columns:
              - column: {name: account_id}